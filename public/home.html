<h2>Add New Order</h2>
<div class="container mt-5">
    <h2>Add New Order</h2>
    <!-- Added all missing input fields matching your JS document.getElementById calls -->
    <form id="orderForm" class="row g-3">
        <div class="col-md-6">
            <label for="orderDesc" class="form-label">orderDesc</label>
            <input type="text" class="form-control" id="orderDesc" required>
        </div>
        <div class="col-md-6">
            <label for="quantity" class="form-label">quantity</label>
            <input type="text" class="form-control" id="quantity" required>
        </div>
        <div class="col-md-6">
            <label for="unitCost" class="form-label">unitCost</label>
            <input type="text" class="form-control" id="unitCost" required>
        </div>      
        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-success">Submit Order</button>
        </div>
    </form>
</div>
